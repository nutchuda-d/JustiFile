# Serves the separate web front end and forwards API calls to Odoo,
# so the browser talks to one origin (no CORS, session cookie just works).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 40m;   # evidence files are sent base64-encoded

    location /api/ {
        proxy_pass http://odoo:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Only the two session endpoints the officer page needs - the rest of Odoo's UI stays on :8069.
    location = /web/session/authenticate { proxy_pass http://odoo:8069; proxy_set_header Host $host; }
    location = /web/session/destroy      { proxy_pass http://odoo:8069; proxy_set_header Host $host; }

    location / { try_files $uri $uri/ =404; }
}
