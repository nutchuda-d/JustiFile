<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JustiFile - Open Procurement</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>JustiFile · Open Procurement</h1>
  <nav><a href="index.html">Public view</a><a href="officer.html">Officer page</a></nav>
</header>
<main>
  <div id="error" class="notice err hidden"></div>

  <section>
    <h2>Filter</h2>
    <form id="search">
      <div class="grid2">
        <label>Search project, agency or contractor <input id="q" type="search"></label>
        <label>Agency <input id="f-agency" list="agency-list" placeholder="All agencies"><datalist id="agency-list"></datalist></label>
        <label>Province <select id="f-province"><option value="">All provinces</option></select></label>
        <label>Procurement method <select id="f-method"><option value="">All methods</option></select></label>
        <label>Budget year (B.E.) <select id="f-year"><option value="">All years</option></select></label>
      </div>
      <button type="submit">Apply</button>
      <button type="button" class="secondary" id="clear">Clear</button>
    </form>
  </section>

  <div class="cards">
    <div class="card"><div class="num" id="k-count">-</div><div class="lbl">Contracts</div></div>
    <div class="card"><div class="num" id="k-amount">-</div><div class="lbl">Total contract value (THB)</div></div>
    <div class="card"><div class="num" id="k-agency">-</div><div class="lbl">Agencies</div></div>
  </div>

  <section>
    <h2>By procurement method</h2>
    <div class="scroll"><table id="t-method"></table></div>
  </section>

  <section>
    <h2>By month</h2>
    <div class="scroll"><table id="t-month"></table></div>
  </section>

  <section>
    <h2>Contracts</h2>
    <p class="muted" id="c-total"></p>
    <div class="scroll" id="c-list"></div>
    <p><button class="secondary" id="prev">Previous</button> <button class="secondary" id="next">Next</button></p>
    <p class="muted">Source: Comptroller General's Department open data (govspending.data.go.th) and entries by municipal officers.</p>
  </section>
</main>
<script src="app.js"></script>
<script>
const PAGE = 20;
let offset = 0;

function showError(e) { $("error").textContent = e.message; $("error").classList.remove("hidden"); }

function breakdown(tableId, label, rows, key) {
  const table = $(tableId);
  table.replaceChildren();
  const head = document.createElement("tr");
  head.appendChild(el("th", label));
  head.appendChild(el("th", "Contracts", "num"));
  head.appendChild(el("th", "Value (THB)", "num"));
  head.appendChild(el("th", ""));
  table.appendChild(head);
  const max = Math.max(1, ...rows.map((r) => r.amount));
  rows.forEach((r) => {
    const bar = el("div", null, "bar");
    bar.style.width = Math.round((r.amount / max) * 160) + "px";
    table.appendChild(row([r[key], { num: true, text: r.count }, num(r.amount), bar]));
  });
}

function filterQuery() {
  const params = new URLSearchParams();
  const values = { q: $("q").value.trim(), agency: $("f-agency").value.trim(), province: $("f-province").value,
                   method: $("f-method").value, year: $("f-year").value };
  Object.entries(values).forEach(([key, value]) => { if (value) params.set(key, value); });
  return params;
}

function fillSelect(id, values) {
  values.forEach((value) => { const o = el("option", String(value)); o.value = value; $(id).appendChild(o); });
}

async function loadFilters() {
  const f = await api("/public/filters");
  f.agencies.forEach((name) => { const o = document.createElement("option"); o.value = name; $("agency-list").appendChild(o); });
  fillSelect("f-province", f.provinces);
  fillSelect("f-method", f.methods);
  fillSelect("f-year", f.years);
}

async function loadSummary() {
  const s = await api("/public/summary?" + filterQuery());
  $("k-count").textContent = s.contract_count.toLocaleString("en-US");
  $("k-amount").textContent = money(s.total_amount);
  $("k-agency").textContent = s.agency_count;
  breakdown("t-method", "Method", s.by_method, "method");
  breakdown("t-month", "Month", s.by_month, "month");
}

async function loadContracts() {
  const params = filterQuery();
  params.set("limit", PAGE);
  params.set("offset", offset);
  const data = await api("/public/contracts?" + params);
  $("c-total").textContent = data.total
    ? `Showing ${offset + 1}-${offset + data.items.length} of ${data.total}` : "No contracts found.";
  $("c-list").replaceChildren(contractsTable(data.items.map((c) => ({ ...c, name: c.name + " — " + c.agency }))));
  $("prev").disabled = offset === 0;
  $("next").disabled = offset + PAGE >= data.total;
}

function reload() {
  offset = 0;
  $("error").classList.add("hidden");
  loadSummary().catch(showError);
  loadContracts().catch(showError);
}

$("search").addEventListener("submit", (e) => { e.preventDefault(); reload(); });
$("clear").addEventListener("click", () => { $("search").reset(); reload(); });
$("prev").addEventListener("click", () => { offset = Math.max(0, offset - PAGE); loadContracts().catch(showError); });
$("next").addEventListener("click", () => { offset += PAGE; loadContracts().catch(showError); });
loadFilters().catch(showError);
reload();
</script>
</body>
</html>
